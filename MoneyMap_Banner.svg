<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#0F0F12; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7C6FF7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#4237A8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F0F12" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="accentGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6D5FED" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#0F0F12" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#18181B" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Brand Linear Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C6FF7"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6FF7"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="#0F0F12"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#accentGlow)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="250" y1="0" x2="250" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="550" y1="0" x2="550" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="850" y1="0" x2="850" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1150" y1="0" x2="1150" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(80, 85)">
    <!-- App Badge -->
    <rect x="0" y="0" width="170" height="34" rx="17" fill="#7C6FF7" fill-opacity="0.15" stroke="#7C6FF7" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="17" r="5" fill="#7C6FF7"/>
    <text x="30" y="22" font-size="13" font-weight="600" fill="#C4B5FD" letter-spacing="0.5">PERSONAL FINANCE</text>

    <!-- Main Title -->
    <text x="0" y="95" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
      MoneyMap
    </text>
    
    <!-- Tagline -->
    <text x="0" y="140" font-size="20" font-weight="500" fill="#A1A1AA" letter-spacing="-0.2">
      Intelligent Budgeting &amp; Spend Visualization
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="185" font-size="15" font-weight="400" fill="#71717A" line-height="24">
      <tspan x="0" dy="0">Take total control of your money with flexible Weekly, Monthly</tspan>
      <tspan x="0" dy="24">&amp; Yearly budgets. Real-time visual tracking of what you spend</tspan>
      <tspan x="0" dy="24">and instant awareness of what is left.</tspan>
    </text>

    <!-- Key Feature Pills -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="155" height="32" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="14" cy="16" r="4" fill="#34D399"/>
      <text x="26" y="21" font-size="12" font-weight="600" fill="#E4E4E7">Weekly / Monthly</text>

      <!-- Pill 2 -->
      <rect x="165" y="0" width="165" height="32" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="179" cy="16" r="4" fill="#7C6FF7"/>
      <text x="191" y="21" font-size="12" font-weight="600" fill="#E4E4E7">Visual Spend Rings</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="160" height="32" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="354" cy="16" r="4" fill="#38BDF8"/>
      <text x="366" y="21" font-size="12" font-weight="600" fill="#E4E4E7">OCR Receipt Scan</text>
    </g>

    <!-- Tech Stack Row -->
    <g transform="translate(0, 340)">
      <text x="0" y="16" font-size="11" font-weight="700" fill="#52525B" letter-spacing="1.2">ARCHITECTURE &amp; TECH STACK</text>
      
      <g transform="translate(0, 30)">
        <!-- React Native / Expo -->
        <rect x="0" y="0" width="125" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
        <text x="12" y="18" font-size="12" font-weight="500" fill="#DDD6FE">⚛ React Native</text>

        <!-- TypeScript -->
        <rect x="135" y="0" width="105" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
        <text x="147" y="18" font-size="12" font-weight="500" fill="#93C5FD">TS TypeScript</text>

        <!-- Node.js -->
        <rect x="250" y="0" width="85" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
        <text x="262" y="18" font-size="12" font-weight="500" fill="#86EFAC">Node.js</text>

        <!-- Docker -->
        <rect x="345" y="0" width="85" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
        <text x="357" y="18" font-size="12" font-weight="500" fill="#7DD3FC">🐳 Docker</text>

        <!-- PostgreSQL + Prisma -->
        <rect x="440" y="0" width="150" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
        <text x="452" y="18" font-size="12" font-weight="500" fill="#C4B5FD">🐘 Postgres + Prisma</text>
      </g>
    </g>

    <!-- Repositories Links Callout -->
    <g transform="translate(0, 425)">
      <rect x="0" y="0" width="500" height="42" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <text x="16" y="26" font-size="12" font-weight="600" fill="#A1A1AA">Frontend &amp; Backend Repos:</text>
      <text x="180" y="26" font-size="12" font-weight="600" fill="#A78BFA">github.com/SUSH9391/MoneyMap-*</text>
    </g>
  </g>

  <!-- RIGHT SHOWCASE MOCKUP CARD -->
  <g transform="translate(710, 60)" filter="url(#shadow)">
    <!-- Main Floating Card Container -->
    <rect x="0" y="0" width="410" height="510" rx="24" fill="url(#cardGrad)" stroke="#3F3F46" stroke-width="1.5"/>
    
    <!-- Top Header inside Mockup -->
    <g transform="translate(24, 28)">
      <text x="0" y="14" font-size="11" font-weight="700" fill="#A1A1AA" letter-spacing="1">BUDGET OVERVIEW</text>
      
      <!-- Period Selector Switch -->
      <rect x="185" y="-4" width="175" height="30" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <rect x="242" y="-2" width="60" height="26" rx="6" fill="#7C6FF7"/>
      <text x="202" y="15" font-size="11" font-weight="600" fill="#71717A">Week</text>
      <text x="254" y="15" font-size="11" font-weight="600" fill="#FFFFFF">Month</text>
      <text x="317" y="15" font-size="11" font-weight="600" fill="#71717A">Year</text>
    </g>

    <!-- Visual Spend Radial Indicator -->
    <g transform="translate(205, 175)">
      <!-- Outer Track Ring -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="#27272A" stroke-width="16"/>
      <!-- Active Progress Ring (62% Spent) -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="16"
              stroke-dasharray="515" stroke-dashoffset="195" stroke-linecap="round"
              transform="rotate(-90)"/>
      
      <!-- Center Stats -->
      <text x="0" y="-12" font-size="12" font-weight="600" fill="#A1A1AA" text-anchor="middle">SPENT SO FAR</text>
      <text x="0" y="18" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">$1,840</text>
      <text x="0" y="38" font-size="12" font-weight="600" fill="#34D399" text-anchor="middle">61% of $3,000</text>
    </g>

    <!-- Remaining Balance Alert Badge -->
    <g transform="translate(24, 285)">
      <rect x="0" y="0" width="362" height="64" rx="14" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      
      <g transform="translate(18, 20)">
        <circle cx="12" cy="12" r="14" fill="#34D399" fill-opacity="0.15"/>
        <text x="12" y="17" font-size="14" text-anchor="middle" fill="#34D399">✓</text>
        
        <text x="38" y="8" font-size="11" font-weight="600" fill="#71717A">REMAINING TO SPEND</text>
        <text x="38" y="28" font-size="20" font-weight="700" fill="#FAFAFA">$1,160.00 <tspan font-size="12" font-weight="400" fill="#A1A1AA">left</tspan></text>
      </g>
    </g>

    <!-- Category Breakdown Mini Bars -->
    <g transform="translate(24, 370)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#A1A1AA" letter-spacing="0.8">CATEGORY BUDGET ALLOCATIONS</text>

      <!-- Category 1: Groceries -->
      <g transform="translate(0, 16)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#E4E4E7">Groceries &amp; Supplies</text>
        <text x="362" y="12" font-size="12" font-weight="600" fill="#A1A1AA" text-anchor="end">$520 / $600</text>
        <rect x="0" y="18" width="362" height="6" rx="3" fill="#27272A"/>
        <rect x="0" y="18" width="313" height="6" rx="3" fill="#7C6FF7"/>
      </g>

      <!-- Category 2: Dining & Entertainment -->
      <g transform="translate(0, 56)">
        <text x="0" y="12" font-size="12" font-weight="600" fill="#E4E4E7">Dining &amp; Leisure</text>
        <text x="362" y="12" font-size="12" font-weight="600" fill="#A1A1AA" text-anchor="end">$340 / $500</text>
        <rect x="0" y="18" width="362" height="6" rx="3" fill="#27272A"/>
        <rect x="0" y="18" width="246" height="6" rx="3" fill="#38BDF8"/>
      </g>
    </g>

    <!-- Bottom Mini Floating Badge (Receipt OCR Processed) -->
    <g transform="translate(-25, 430)" filter="url(#shadow)">
      <rect x="0" y="0" width="220" height="48" rx="12" fill="#27272A" stroke="#7C6FF7" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="12" fill="#7C6FF7"/>
      <text x="24" y="28" font-size="12" text-anchor="middle" fill="#FFFFFF">🧾</text>
      <text x="44" y="20" font-size="11" font-weight="700" fill="#FFFFFF">Smart Receipt Scan</text>
      <text x="44" y="34" font-size="10" font-weight="500" fill="#34D399">✓ OCR Auto-categorized</text>
    </g>
  </g>
</svg>
